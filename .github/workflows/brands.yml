# Brand icons for the app (see .github/brands/fetch.mjs). On request only:
# collects every icon each brand's own site offers, for a person to choose
# from, onto the brand-candidates branch (not served by the site).
name: Brand icons

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect candidates
        run: |
          node .github/brands/fetch.mjs .github/brands/list.json .github/brands/out
      # On a branch of their own, never on gh-pages: other companies' icons
      # are material to choose from, not something this site serves.
      - name: Keep them on the brand-candidates branch
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp -r .github/brands/out/. "$tmp/"
          git fetch -q origin brand-candidates || true
          if git rev-parse -q --verify origin/brand-candidates >/dev/null; then git checkout -q -B brand-candidates origin/brand-candidates; else git checkout -q --orphan brand-candidates; git rm -rq --cached . || true; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$tmp/." .
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="brand-icons" -c user.email="brand-icons@users.noreply.github.com" commit -qm "Brand icon candidates $(date -u +%F)"
          git push -q origin brand-candidates
