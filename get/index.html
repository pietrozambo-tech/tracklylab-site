<!--
  tracklylab.com/get - the one link to share (Instagram bio, a message).

  It picks the way in for the device it is opened on and puts it first, but
  never jumps on its own: opened inside Instagram's browser, a redirect to
  TestFlight or the App Store often lands on Apple's web page instead of the
  app, or is blocked; a tap on a button always works. On iPhone and iPad the
  first button is the iPhone app, on anything else the web app, with a QR
  code to carry the link to an iPhone. Without JavaScript both show, side by
  side. Italian on an Italian browser, English everywhere else.

  once the app is live - the one line to change.

<script>
  var ua = navigator.userAgent;
  // iPadOS asks for desktop pages and calls itself a Mac; the touch screen
  // gives it away.
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var phone = apple || /Android|Mobile/.test(ua);
  var ways = document.getElementById('ways');
  var first = apple ? 'ios' : 'web';
  var el = document.getElementById(first);
  el.classList.add('first');
  ways.insertBefore(el, ways.firstChild);
  if (!phone) document.body.classList.add('desktop');
  if (/^it\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'it';
    var IT = {
      tagline: 'La lente sulle tue spese.',
      sub: 'Apple Pay si registra da solo. Tutto il resto, in due tocchi.',
      iosTitle: 'Scaricala su iPhone',
      iosNote: 'Beta gratuita su TestFlight · App Store a breve',
      webTitle: 'Usala dal browser',
      webNote: 'Telefono o computer · niente da installare',
      qr: 'Hai un iPhone? Inquadra il codice con la fotocamera.'
    };
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = IT[n.getAttribute('data-t')]; });
    document.title = 'Scarica TracklyLab';
  }
